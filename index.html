<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#993C1D">
<title>ラーメン予測カレンダー</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; }
  body { font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif; color: #2C2C2A; background: #FAF7F0; min-height: 100vh; }
  .wrap { max-width: 460px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 22px; font-weight: 700; margin: 0; color: #993C1D; }
  .brandRow { display: flex; align-items: center; gap: 8px; }
  .bowl { font-size: 28px; }
  .sub { font-size: 13px; color: #5F5E5A; margin: 6px 0 4px; }
  .syncBar { font-size: 12px; margin: 0 0 16px; padding: 6px 10px; border-radius: 8px; display:inline-block; }
  .syncOn { background:#E1F5EE; color:#0F6B4F; }
  .syncWait { background:#F1EFE8; color:#888780; }
  .syncErr { background:#FBE8E5; color:#A32D2D; }
  .card { background: #fff; border-radius: 16px; padding: 18px; box-shadow: 0 2px 12px rgba(153,60,29,0.08); border: 1px solid #F0E6DC; margin-bottom: 16px; }
  .predictTop { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; }
  .predictLabel { font-size: 15px; font-weight: 700; }
  .predictHint { font-size: 12px; color: #888780; margin-top: 2px; }
  select { font-size: 14px; padding: 6px 10px; border-radius: 8px; border: 1px solid #D3D1C7; background: #FAF7F0; }
  .needData { font-size: 13px; color: #888780; text-align: center; padding: 16px 0; }
  .gaugeWrap { display: flex; align-items: center; gap: 14px; }
  .gaugeTrack { flex: 1; height: 14px; background: #F1EFE8; border-radius: 7px; overflow: hidden; }
  .gaugeFill { height: 100%; border-radius: 7px; transition: width .4s ease; width: 0; }
  .gaugeNum { display: flex; flex-direction: column; align-items: center; min-width: 64px; }
  .gaugePct { font-size: 26px; font-weight: 700; }
  .gaugeCaption { font-size: 11px; color: #888780; margin-top: 2px; }
  .tmInfo { font-size: 12px; color: #888780; margin-top: 10px; text-align: center; }
  .calHead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .navBtn { font-size: 22px; width: 38px; height: 38px; border: none; background: #F1EFE8; border-radius: 8px; color: #5F5E5A; }
  .monthLabel { font-size: 16px; font-weight: 700; }
  .weekRow, .grid { display: grid; grid-template-columns: repeat(7,1fr); }
  .weekRow { margin-bottom: 4px; }
  .weekCell { text-align: center; font-size: 12px; font-weight: 600; padding: 4px 0; }
  .grid { gap: 4px; }
  .dayCell { aspect-ratio: 1; border: 1px solid #F0E6DC; border-radius: 10px; background: #fff; position: relative; padding: 0; display: flex; align-items: center; justify-content: center; }
  .dayNum { font-size: 13px; color: #5F5E5A; position: absolute; top: 4px; left: 6px; }
  .todayCell { border: 2px solid #D85A30; }
  .selCell { box-shadow: 0 0 0 2px #BA7517; }
  .wentCell { background: #E1F5EE; border-color: #9FE1CB; }
  .skipCell { background: #F1EFE8; }
  .mark { font-size: 18px; animation: pop .25s ease; }
  .markX { font-size: 16px; color: #B4B2A9; }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .editHead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .editDate { font-size: 16px; font-weight: 700; }
  .clearBtn { font-size: 12px; color: #A32D2D; background: none; border: none; text-decoration: underline; }
  .fieldLabel { font-size: 13px; font-weight: 600; color: #5F5E5A; margin: 10px 0 6px; display:flex; justify-content:space-between; align-items:center; }
  .toggleRow { display: flex; gap: 8px; }
  .toggleBtn { flex: 1; padding: 12px 0; font-size: 14px; border: 1px solid #D3D1C7; border-radius: 10px; background: #FAF7F0; color: #5F5E5A; }
  .toggleOnGo { background: #1D9E75; color: #fff; border-color: #1D9E75; }
  .toggleOnSkip { background: #888780; color: #fff; border-color: #888780; }
  .weatherRow { display: flex; gap: 6px; }
  .weatherBtn { flex: 1; padding: 10px 0; font-size: 13px; border: 1px solid #D3D1C7; border-radius: 8px; background: #FAF7F0; color: #5F5E5A; }
  .weatherOn { background: #378ADD; color: #fff; border-color: #378ADD; }
  .tempRow { display:flex; align-items:center; gap:8px; }
  .tempInput { width: 80px; font-size:14px; padding:8px 10px; border:1px solid #D3D1C7; border-radius:8px; background:#FAF7F0; }
  .autoBtn { font-size:12px; padding:6px 12px; border:1px solid #378ADD; color:#185FA5; background:#E6F1FB; border-radius:8px; }
  .miniNote { font-size:11px; color:#888780; }
  .infoNote { font-size: 12px; color: #888780; margin-top: 12px; }
  .weightTitle { font-size: 14px; font-weight: 700; margin-bottom: 12px; }
  .wbRow { margin-bottom: 10px; }
  .wbLabel { font-size: 13px; color: #5F5E5A; display: block; margin-bottom: 4px; }
  .wbTrack { position: relative; height: 12px; background: #F1EFE8; border-radius: 6px; }
  .wbCenter { position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: #B4B2A9; }
  .wbFill { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
  .weightNote { font-size: 11px; color: #888780; margin-top: 8px; line-height: 1.6; }
  button { cursor: pointer; font-family: inherit; }

  /* ====== 下部タブバー ====== */
  .wrap { padding-bottom: 92px; }
  .tabBar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    background: rgba(255,255,255,0.94); backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px); border-top: 1px solid #EADFD2; }
  .tabBarInner { max-width: 460px; margin: 0 auto; display: flex; }
  .tabBtn { flex: 1; border: none; background: none;
    padding: 9px 0 calc(9px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    color: #9A988F; font-size: 11px; font-weight: 700; }
  .tabIcon { font-size: 21px; line-height: 1; }
  .tabBtn.tabActive { color: #993C1D; }
  .tabBtn.tabActive[data-view="name"] { color: #C5402B; }

  /* ====== 偽名メーカー ====== */
  .nameTitle { color: #C5402B; }
  .segRow { display: flex; gap: 8px; }
  .segBtn { flex: 1; padding: 12px 0; font-size: 14px; font-weight: 600;
    border: 1px solid #D3D1C7; border-radius: 10px; background: #FAF7F0; color: #5F5E5A; }
  .segBtn.segOn { background: #C5402B; color: #fff; border-color: #C5402B; }
  .nameResult { min-height: 120px; display: flex; align-items: center; justify-content: center; }
  .nameEmpty { font-size: 13px; color: #9A988F; text-align: center; line-height: 1.7; }
  .nameDoc { display: flex; align-items: center; justify-content: space-between; gap: 16px; width: 100%; }
  .nameText { flex: 1; }
  .nameKana { font-size: 14px; color: #9A988F; letter-spacing: 2px; margin-bottom: 4px; }
  .nameKanji { font-size: 30px; font-weight: 700; letter-spacing: 3px; color: #2C2C2A;
    font-family: 'Hiragino Mincho ProN', 'Yu Mincho', 'YuMincho', serif; }
  .nameMeta { font-size: 12px; color: #9A988F; margin-top: 10px; }
  .nameKana .hotSei, .nameKanji .hotSei { color: #C5402B; }
  .nameKana .hotMei, .nameKanji .hotMei { color: #2B6CB0; }
  .seal { width: 76px; height: 76px; flex-shrink: 0; border-radius: 50%;
    border: 2.5px solid #C5402B; color: #C5402B;
    display: flex; align-items: center; justify-content: center;
    writing-mode: vertical-rl; font-weight: 700; letter-spacing: 3px;
    font-family: 'Hiragino Mincho ProN', 'Yu Mincho', serif;
    transform: rotate(-4deg); box-shadow: inset 0 0 0 1px rgba(197,64,43,0.25); }
  .seal.len1 { font-size: 30px; }
  .seal.len2 { font-size: 24px; }
  .seal.len3 { font-size: 18px; }
  .seal.len4 { font-size: 14px; letter-spacing: 1px; }
  @keyframes stampIn {
    0% { transform: rotate(-4deg) scale(1.7); opacity: 0; }
    55% { transform: rotate(-4deg) scale(0.9); opacity: 1; }
    100% { transform: rotate(-4deg) scale(1); } }
  .seal.stamp { animation: stampIn .34s cubic-bezier(.2,.8,.3,1); }
  @keyframes nameRise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .nameText.rise { animation: nameRise .28s ease; }
  .genBtn { width: 100%; padding: 16px; font-size: 17px; font-weight: 700; color: #fff;
    background: #C5402B; border: none; border-radius: 14px;
    box-shadow: 0 4px 14px rgba(197,64,43,0.28); }
  .genBtn:active { transform: translateY(1px); box-shadow: 0 2px 8px rgba(197,64,43,0.28); }
  @media (prefers-reduced-motion: reduce) {
    .seal.stamp, .nameText.rise { animation: none; }
  }
</style>
</head>
<body>
<div class="wrap">
 <div id="view-ramen">
  <div class="brandRow"><span class="bowl">🍜</span><h1>中井氏　一風堂予測カレンダー</h1></div>
  <p class="sub">彼が一風堂に行くのか行かないのかを正確に予測します！！</p>
  <div id="syncBar" class="syncBar syncWait">接続中…</div>

  <div class="card">
    <div class="predictTop">

 <div id="view-name" style="display:none;">

 </div><!-- /view-name -->
</div>

<nav class="tabBar">

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import { getFirestore, doc, setDoc, deleteDoc, collection, onSnapshot }
  from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

// ====== Firebase 設定 ======
const firebaseConfig = {
  apiKey: "AIzaSyANzM46R9wa7obEWlUoP4ekOMZqxtszxBY",
  authDomain: "ramen-8f60e.firebaseapp.com",
  projectId: "ramen-8f60e",
  storageBucket: "ramen-8f60e.firebasestorage.app",
  messagingSenderId: "574081502285",
  appId: "1:574081502285:web:272019915916b109486004",
  measurementId: "G-5ZLW74B2TG"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const COL = "records"; // Firestore上のコレクション名

// ====== 設定：取得地点（横浜駅周辺）======
const LAT = 35.466, LON = 139.622;

const WEEKDAYS = ["日","月","火","水","木","金","土"];
const WEATHERS = [
  {key:"sunny",label:"晴れ"},{key:"cloudy",label:"曇り"},
  {key:"rainy",label:"雨"},{key:"snowy",label:"雪"}
];

const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };

let records = {};         // Firestoreから同期される
const today = new Date();
let viewYear = today.getFullYear();
let viewMonth = today.getMonth();
let selected = null;
let tomorrowWeather = "sunny";
let tomorrowTemp = null;
const weatherCache = {};

// ====== Firestore 同期 ======
function setSync(state, msg){
  const el = document.getElementById("syncBar");
  el.className = "syncBar " + (state==="on"?"syncOn":state==="err"?"syncErr":"syncWait");
  el.textContent = msg;
}
// ドキュメントIDに使えるようYMDのハイフンはそのまま利用可
async function pushRecord(dateStr, data){
  try { await setDoc(doc(db, COL, dateStr), data); }
  catch(e){ setSync("err","保存に失敗しました（通信状態を確認）"); }
}
async function removeRecord(dateStr){
  try { await deleteDoc(doc(db, COL, dateStr)); }
  catch(e){ setSync("err","削除に失敗しました"); }
}
function startSync(){
  onSnapshot(collection(db, COL),
    snap => {
      const next = {};
      snap.forEach(d => { next[d.id] = d.data(); });
      records = next;
      setSync("on","リアルタイム同期中");
      render();
    },
    err => { setSync("err","同期エラー（ルール設定を確認）"); }
  );
}

// ====== WMO天気コード → 4分類 ======
function codeToWeather(code){
  if(code===0||code===1) return "sunny";
  if(code===2||code===3||code===45||code===48) return "cloudy";
  if((code>=71&&code<=77)||code===85||code===86) return "snowy";
  return "rainy";
}
async function fetchWeather(dateStr){
  if(weatherCache[dateStr]) return weatherCache[dateStr];
  const target = parseYmd(dateStr);
  const base = new Date(today.getFullYear(),today.getMonth(),today.getDate());
  const diffDays = Math.round((target - base)/86400000);
  const past = diffDays < 0 ? Math.min(92, -diffDays) : 0;
  const fdays = diffDays >= 0 ? Math.min(16, diffDays+1) : 1;
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}`
    + `&daily=weather_code,temperature_2m_max&timezone=Asia%2FTokyo`
    + `&past_days=${past}&forecast_days=${fdays}`;
  const res = await fetch(url);
  if(!res.ok) throw new Error("weather fetch failed");
  const data = await res.json();
  const idx = data.daily.time.indexOf(dateStr);
  if(idx === -1) throw new Error("date not in range");
  const result = { weather: codeToWeather(data.daily.weather_code[idx]), temp: Math.round(data.daily.temperature_2m_max[idx]) };
  weatherCache[dateStr] = result;
  return result;
}

// ====== 特徴量・モデル ======
function buildFeatures(rec, daysSince){
  const wd = parseYmd(rec.date).getDay();
  const isWeekend = (wd===0||wd===6)?1:0;
  const badWeather = (rec.weather==="rainy"||rec.weather==="snowy")?1:0;
  const sinceNorm = Math.min(daysSince ?? 7, 14)/14;
  const t = (rec.temp==null?20:rec.temp);
  const tempNorm = Math.max(0, Math.min(1, t/35));
  return [1, isWeekend, badWeather, sinceNorm, tempNorm];
}
const sigmoid = z => 1/(1+Math.exp(-z));
function trainLogReg(X,y,{lr=0.3,epochs=800,l2=0.01}={}){
  const n=X.length; if(!n) return null;
  const dim=X[0].length; let w=new Array(dim).fill(0);
  for(let e=0;e<epochs;e++){
    const g=new Array(dim).fill(0);
    for(let i=0;i<n;i++){
      const z=X[i].reduce((s,xj,j)=>s+xj*w[j],0);
      const err=sigmoid(z)-y[i];
      for(let j=0;j<dim;j++) g[j]+=err*X[i][j];
    }
    for(let j=0;j<dim;j++){ const reg=j===0?0:l2*w[j]; w[j]-=lr*(g[j]/n+reg); }
  }
  return w;
}
const predictProb = (w,f)=> w? sigmoid(f.reduce((s,xj,j)=>s+xj*w[j],0)) : null;
function daysSinceLastVisit(dateStr){
  const target=parseYmd(dateStr).getTime(); let best=null;
  for(const r of Object.values(records)){
    if(!r.went) continue;
    const t=parseYmd(r.date).getTime();
    if(t<target && (best===null||t>best)) best=t;
  }
  return best===null?7:Math.round((target-best)/86400000);
}
function trainModel(){
  const list=Object.values(records).filter(r=>r.weather && r.userSet);
  if(list.length<3) return {w:null,count:list.length};
  const X=[],y=[];
  for(const r of list){ X.push(buildFeatures(r, daysSinceLastVisit(r.date))); y.push(r.went?1:0); }
  return {w:trainLogReg(X,y),count:list.length};
}

const probColor = p => p>=0.66?"#1D9E75":p>=0.33?"#BA7517":"#A32D2D";
const wLabel = k => { const w=WEATHERS.find(w=>w.key===k); return w?w.label:""; };

function render(){
  const model = trainModel();
  renderPredict(model); renderCalendar(); renderEdit(); renderWeights(model);
}
function renderPredict(model){
  const tomorrow = addDays(today,1);
  document.getElementById("tmTitle").textContent = `明日（${ymd(tomorrow)} ${WEEKDAYS[tomorrow.getDay()]}）`;
  document.getElementById("tmWeather").value = tomorrowWeather;
  const body = document.getElementById("predictBody");
  if(!model.w){
    body.innerHTML = `<div class="needData">予測には記録した日があと ${Math.max(0,3-model.count)} 日分必要です（最低3件）</div>`;
    return;
  }
  const ds = daysSinceLastVisit(ymd(tomorrow));
  const feat = buildFeatures({date:ymd(tomorrow),weather:tomorrowWeather,temp:tomorrowTemp}, ds);
  const p = predictProb(model.w, feat);
  const col = probColor(p);
  body.innerHTML = `<div class="gaugeWrap">
       <div class="gaugeTrack"><div class="gaugeFill" style="width:${(p*100).toFixed(0)}%;background:${col};"></div></div>
       <div class="gaugeNum"><span class="gaugePct" style="color:${col};">${(p*100).toFixed(0)}%</span>
         <span class="gaugeCaption">${p>=0.5?"行きそう":"行かなそう"}</span></div></div>`;
}
function renderCalendar(){
  document.getElementById("monthLabel").textContent = `${viewYear}年 ${viewMonth+1}月`;
  document.getElementById("weekRow").innerHTML = WEEKDAYS.map((w,i)=>{
    const c = i===0?"#A32D2D":i===6?"#185FA5":"#888780";
    return `<div class="weekCell" style="color:${c};">${w}</div>`;
  }).join("");
  const first=new Date(viewYear,viewMonth,1);
  const startPad=first.getDay();
  const daysInMonth=new Date(viewYear,viewMonth+1,0).getDate();
  let html="";
  for(let i=0;i<startPad;i++) html+=`<div></div>`;
  for(let d=1;d<=daysInMonth;d++){
    const date=new Date(viewYear,viewMonth,d);
    const ds=ymd(date); const rec=records[ds];
    let cls="dayCell";
    if(ds===ymd(today)) cls+=" todayCell";
    if(ds===selected) cls+=" selCell";
    if(rec&&rec.userSet&&rec.went) cls+=" wentCell";
    if(rec&&rec.userSet&&!rec.went) cls+=" skipCell";
    let mark="";
    if(rec&&rec.userSet&&rec.went) mark=`<span class="mark">🍜</span>`;
    else if(rec&&rec.userSet&&!rec.went) mark=`<span class="markX">×</span>`;
    html+=`<button class="${cls}" data-date="${ds}"><span class="dayNum">${d}</span>${mark}</button>`;
  }
  const grid=document.getElementById("grid");
  grid.innerHTML=html;
  grid.querySelectorAll("[data-date]").forEach(btn=>{
    btn.addEventListener("click",()=>{ selected=btn.dataset.date; render(); autoFillWeather(selected); });
  });
}
async function autoFillWeather(dateStr){
  const rec = records[dateStr];
  if(rec && rec.weather) return;
  try {
    const w = await fetchWeather(dateStr);
    const base = {date:dateStr, went:false, userSet:false, weather:"", temp:null};
    const merged = {...base, ...(records[dateStr]||{}), weather:w.weather, temp:w.temp};
    await pushRecord(dateStr, merged);
  } catch(e){ /* 失敗時は手動入力 */ }
}
function renderEdit(){
  const card=document.getElementById("editCard");
  if(!selected){ card.style.display="none"; return; }
  card.style.display="block";
  const rec=records[selected];
  const wd=WEEKDAYS[parseYmd(selected).getDay()];
  const weatherBtns=WEATHERS.map(w=>
    `<button class="weatherBtn ${rec&&rec.weather===w.key?"weatherOn":""}" data-w="${w.key}">${w.label}</button>`
  ).join("");
  card.innerHTML = `<div class="editHead">
       <span class="editDate">${selected}（${wd}）</span>
       ${rec&&rec.userSet?`<button class="clearBtn" id="clearRec">記録を消す</button>`:""}
     </div>
     <div class="fieldLabel">この日は行った？</div>
     <div class="toggleRow">
       <button class="toggleBtn ${rec&&rec.userSet&&rec.went?"toggleOnGo":""}" id="goBtn">🍜 行った</button>
       <button class="toggleBtn ${rec&&rec.userSet&&!rec.went?"toggleOnSkip":""}" id="skipBtn">× 行かなかった</button>
     </div>
     <div class="fieldLabel"><span>天気</span><button class="autoBtn" id="autoBtn">自動取得</button></div>
     <div class="weatherRow">${weatherBtns}</div>
     <div class="fieldLabel">最高気温（℃）</div>
     <div class="tempRow">
       <input class="tempInput" id="tempInput" type="number" inputmode="numeric" value="${rec&&rec.temp!=null?rec.temp:""}" placeholder="例 18">
       <span class="miniNote">自動取得で自動入力</span>
     </div>
     ${rec?`<div class="infoNote">前回ラーメンから ${daysSinceLastVisit(selected)} 日</div>`:""}`;

  const setRec = patch => {
    const base = {date:selected,went:false,weather:"",temp:null,userSet:false};
    const merged = {...base, ...(records[selected]||{}), ...patch};
    pushRecord(selected, merged);
  };
  document.getElementById("goBtn").onclick=()=>setRec({went:true,userSet:true});
  document.getElementById("skipBtn").onclick=()=>setRec({went:false,userSet:true});
  card.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>setRec({weather:b.dataset.w}));
  document.getElementById("tempInput").onchange=e=>{
    const v=e.target.value===""?null:Number(e.target.value); setRec({temp:v});
  };
  document.getElementById("autoBtn").onclick=async ()=>{
    const btn=document.getElementById("autoBtn"); btn.textContent="取得中…";
    try { const w=await fetchWeather(selected); setRec({weather:w.weather,temp:w.temp}); }
    catch(e){ btn.textContent="取得失敗"; setTimeout(()=>{btn.textContent="自動取得";},1500); }
  };
  const clr=document.getElementById("clearRec");
  if(clr) clr.onclick=()=>{ removeRecord(selected); };
}
function renderWeights(model){
  const card=document.getElementById("weightCard");
  if(!model.w){ card.style.display="none"; return; }
  card.style.display="block";
  const bar=(label,value)=>{
    const max=4; const pct=Math.max(-1,Math.min(1,value/max));
    const isPos=pct>=0;
    const left=isPos?"50%":`${50+pct*50}%`;
    const width=`${Math.abs(pct)*50}%`;
    const color=isPos?"#1D9E75":"#A32D2D";
    return `<div class="wbRow"><span class="wbLabel">${label}</span>
      <div class="wbTrack"><div class="wbCenter"></div>
        <div class="wbFill" style="left:${left};width:${width};background:${color};"></div>
      </div></div>`;
  };
  card.innerHTML = `<div class="weightTitle">今のモデルが効きと判断している要素</div>
     ${bar("週末である",model.w[1])}
     ${bar("天気が悪い（雨・雪）",model.w[2])}
     ${bar("前回から日が空いている",model.w[3])}
     ${bar("気温が高い",model.w[4])}
     <div class="weightNote">右(緑)に伸びるほど「行く方向」、左(赤)ほど「行かない方向」に働く要素です。</div>`;
}
async function loadTomorrow(){
  const t = ymd(addDays(today,1));
  try {
    const w = await fetchWeather(t);
    tomorrowWeather = w.weather; tomorrowTemp = w.temp;
    document.getElementById("tmInfo").textContent = `予報：${wLabel(w.weather)} / 最高 ${w.temp}℃（自動取得）`;
  } catch(e){
    document.getElementById("tmInfo").textContent = "予報の自動取得に失敗。天気を手動で選んでください。";
  }
  render();
}

document.getElementById("prevM").onclick=()=>{ if(viewMonth===0){viewMonth=11;viewYear--;}else viewMonth--; render(); };
document.getElementById("nextM").onclick=()=>{ if(viewMonth===11){viewMonth=0;viewYear++;}else viewMonth++; render(); };
document.getElementById("tmWeather").onchange=e=>{ tomorrowWeather=e.target.value; render(); };

render();
startSync();
loadTomorrow();
</script>

let nameGender = "male";

function pickWeighted(arr){
  const total = arr.reduce((s,o)=>s+(o.w||1),0);
  let r = Math.random()*total;
  for(const o of arr){ r -= (o.w||1); if(r<0) return o; }
  return arr[arr.length-1];
}
const pick = a => a[Math.floor(Math.random()*a.length)];

function generateName(){
